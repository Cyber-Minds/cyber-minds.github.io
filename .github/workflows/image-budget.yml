name: Course image budgets

on:
  pull_request:
    paths:
      - 'HTML/Courses and Activities/**'
      - 'Images/**'
      - 'scripts/image-budget-*'
      - 'docs/IMAGE-BUDGETS.md'
      - 'package.json'
      - '.github/workflows/image-budget.yml'
  push:
    branches: [main]
    paths:
      - 'HTML/Courses and Activities/**'
      - 'Images/**'
      - 'scripts/image-budget-*'
      - 'docs/IMAGE-BUDGETS.md'
      - 'package.json'
      - '.github/workflows/image-budget.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check course image budgets
        run: node scripts/image-budget-audit.js
