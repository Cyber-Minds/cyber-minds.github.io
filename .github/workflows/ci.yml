name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests and Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: terminal/backend/go.mod
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Verify build compiles
        run: go build ./...
      - name: Run go vet
        run: go vet ./...
      - name: Run backend unit tests
        run: go test ./... -coverprofile=coverage.out
      - name: Enforce backend coverage gate (>=60%)
        run: ./scripts/check-coverage.sh 60 coverage.out

  frontend:
    name: Frontend ESLint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint (Airbnb base)
        run: npm run lint:frontend
      - name: Check HTML files are non-empty
        run: if find HTML -name "*.html" -empty | grep -q .; then echo "Empty HTML files found"; exit 1; fi

  smoke-tests:
    name: Frontend Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium browser
        run: npx playwright install chromium
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cross-browser-smoke:
    # Compact learner path (course page → quiz → terminal) in the non-Chromium
    # engines. Chromium already runs this spec as part of the full suite in
    # `smoke-tests`, so it is not repeated here. See docs/CROSS-BROWSER-SMOKE.md.
    name: Cross-browser Smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright ${{ matrix.browser }} browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install Playwright ${{ matrix.browser }} with system dependencies
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install ${{ matrix.browser }} system dependencies (browser cached)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      # No report upload: failures are reported in the job log and as
      # annotations naming the browser, route, and step, and test artifacts
      # stay on the runner.
      - name: Run cross-browser smoke path
        run: npx playwright test tests/cross-browser-smoke.spec.js --project=${{ matrix.browser }}
